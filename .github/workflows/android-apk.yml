name: Android APK

# Builds an installable release APK of the mobile app on GitHub's servers, so nobody
# needs the Android SDK locally just to try the app. The release build is signed with
# the committed debug keystore (see mobile/android/app/build.gradle): fine for
# testing and demos, not for the Play Store. It bundles the JS, so no Metro is needed.

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'prototype/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['mobile/**', 'prototype/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      architectures:
        description: 'CPU architectures to build. arm64-v8a = real phones, x86_64 = emulator'
        default: 'arm64-v8a'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci

  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK pieces named in android/build.gradle
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures="${{ inputs.architectures || 'arm64-v8a' }}" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fitlens-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error
