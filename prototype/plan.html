<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>FitLens — Plan</title><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="workouts.css?v=reminders-8"><link rel="stylesheet" href="plan.css"><script src="shared/constants.js" defer></script><script src="shared/dates.js" defer></script><script src="shared/storage.js" defer></script><script src="shared/ids.js" defer></script><script src="shared/exercises.js" defer></script><script src="workout-model.js" defer></script><script src="schedule-model.js" defer></script><script src="draft-model.js" defer></script><script src="workout-store.js" defer></script><script src="plan.js" defer></script></head><body>
<link rel="stylesheet" href="mobile-polish.css?v=1">
<!-- Plan page: a minimal weekly schedule. Data comes from FitLensWorkout (schedule-model.js); suggestions from draft-model.js. -->
<div id="fitlens-home-preview"><div class="fl-phone workouts-phone">    <div class="fl-status"><span>9:41</span><div class="fl-island"></div><span class="fl-status-icons"><svg data-icon="signal" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h2v-3H3zM8 20h2v-7H8zM13 20h2V9h-2zM18 20h2V5h-2z" fill="currentColor" stroke="none"/></svg><svg data-icon="wifi" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 15a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg><svg data-icon="battery-full" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="17" height="12" rx="2"/><path d="M22 10v4"/><rect x="5" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/></svg></span></div>
<div class="workouts-scroll plan-scroll"><header class="workouts-header plan-header"><p class="eyebrow">FITLENS / PLAN</p><h1>Your week<span>.</span></h1></header>
<main class="plan-content">
<nav class="week-nav" aria-label="Choose week"><button type="button" id="prev-week" aria-label="Previous week">‹</button><div><strong id="week-label">This week</strong><small id="week-range"></small></div><button type="button" id="next-week" aria-label="Next week">›</button></nav>
<div class="plan-actions"><button type="button" id="build-week" class="plan-primary">Build my week</button><button type="button" id="copy-week" class="plan-secondary">Copy to next week</button></div>
<p class="plan-status" id="plan-status" role="status"></p>
<ol class="plan-days" id="plan-days"></ol>
</main></div>
<footer class="fl-bottom workouts-bottom"><nav class="fl-dock" aria-label="Main navigation"><a class="fl-dock-item" href="home.html"><svg data-icon="house" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1Z"/></svg><span>Today</span></a><a class="fl-dock-item fl-selected" href="workouts.html" aria-current="page"><svg data-icon="dumbbell" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M4 8l4-4m8 16 4-4M2 6l4-4m12 20 4-4M3 9l6-6m6 18 6-6"/></svg><span>Workouts</span></a><a class="fl-dock-item" href="insights.html"><svg data-icon="chart-no-axes-combined" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V11m6 10V7m6 14v-7m6 7V3M3 7l6-4 6 6 6-8"/></svg><span>Insights</span></a></nav><div class="fl-home-indicator"></div></footer>
<dialog id="add-sheet" aria-labelledby="add-title"><div class="sheet-grip" aria-hidden="true"></div><div class="sheet-heading"><div><p class="eyebrow" id="add-day">DAY</p><h2 id="add-title">Add a workout</h2></div><button type="button" class="close-sheet" aria-label="Close">×</button></div>
<form id="add-form" class="plan-form"><label>Workout<select name="workout" id="add-workout"></select></label><label>Time <small>(optional)</small><input type="time" name="time"></label><p class="plan-form-error" id="add-error" role="alert"></p><button type="submit" class="plan-primary">Add to this day</button></form></dialog>
<dialog id="session-sheet" aria-labelledby="session-title"><div class="sheet-grip" aria-hidden="true"></div><div class="sheet-heading"><div><p class="eyebrow" id="session-day">DAY</p><h2 id="session-title">Session</h2></div><button type="button" class="close-sheet" aria-label="Close">×</button></div>
<form id="session-form" class="plan-form"><label>Day<select name="date" id="session-date"></select></label><label>Time <small>(optional)</small><input type="time" name="time" id="session-time"></label><p class="plan-form-error" id="session-error" role="alert"></p><button type="submit" class="plan-primary">Save changes</button><a id="session-open" class="plan-secondary" href="workouts.html">Open workout</a><button type="button" id="session-done" class="plan-secondary">Mark as done</button><button type="button" id="session-remove" class="plan-danger">Remove from plan</button></form></dialog>
<dialog id="build-sheet" aria-labelledby="build-title"><div class="sheet-grip" aria-hidden="true"></div><div class="sheet-heading"><div><p class="eyebrow">A SUGGESTION, NOT A PRESCRIPTION</p><h2 id="build-title">Build my week</h2></div><button type="button" class="close-sheet" aria-label="Close">×</button></div>
<form id="build-form" class="plan-form"><label>Goal<select name="goal" id="build-goal"></select></label><label>Days per week<select name="days" id="build-days"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
<fieldset><legend>Equipment you have</legend><div class="chip-row" id="build-equipment"></div></fieldset>
<fieldset><legend>Areas to go easy on</legend><div class="chip-row" id="build-regions"></div></fieldset>
<button type="submit" class="plan-primary">Preview</button></form>
<div id="build-preview" class="build-preview" hidden><h3>Your suggested week</h3><ol id="build-list"></ol><p class="plan-form-error" id="build-error" role="alert"></p><button type="button" id="build-apply" class="plan-primary">Use this plan</button><button type="button" id="build-back" class="plan-secondary">Change answers</button></div></dialog>
<div class="sr-only" id="plan-announce" aria-live="polite"></div>
</div></div></body></html>
