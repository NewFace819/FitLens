<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="color-scheme" content="light dark">

  <title>FitLens — Today</title>

  <link rel="stylesheet" href="home-v2.css?v=m0a2-final-1">
  <link rel="stylesheet" href="home-v2-stage.css?v=m0a3-1">
  <link rel="stylesheet" href="steps-sun.css">
  <link rel="stylesheet" href="home-hybrid.css?v=trial-1">

  <link rel="stylesheet" href="account-sheet.css?v=2">
  <link rel="stylesheet" href="home-main.css?v=1">
  <script src="mascot-face.js" defer></script>
  <script src="profile-model.js" defer></script>
  <script src="food-model.js" defer></script>
  <script src="training-model.js" defer></script>
  <script src="activity-model.js" defer></script>
  <script src="training-launch.js" defer></script>
  <script src="steps-sun-data.js" defer></script>
  <script src="steps-sun.js" defer></script>
  <script src="profile-view.js" defer></script>
  <script src="profile.js" defer></script>
  <script src="home-v2-fixtures.js" defer></script>
  <script src="home-v2-stage-fixtures.js" defer></script>
  <script src="home-hybrid-stage.js" defer></script>
  <script src="home-main.js?v=1" defer></script>
</head>

<body class="v2-workspace">

  <div class="v2-workbench" id="fitlens-home-preview">

    <div class="v2-phone hybrid-phone fl-home-phone" id="v2-phone" data-theme="light" data-treatment="spatial" data-week-treatment="a">

      <div class="v2-status fl-status" aria-hidden="true"><span>9:41</span><i></i><span class="v2-status-symbols"><svg viewBox="0 0 24 16"><path d="M2 14v-3m5 3V8m5 6V5m5 9V2"/></svg><svg viewBox="0 0 24 16"><path d="M3 5q9-7 18 0M6 8q6-5 12 0m-9 3q3-2 6 0"/><circle cx="12" cy="14" r=".7"/></svg><svg viewBox="0 0 27 16"><rect x="1" y="3" width="21" height="11" rx="3"/><path d="M25 7v3"/><rect x="4" y="6" width="15" height="5" rx="1" fill="currentColor" stroke="none"/></svg></span></div>



      <button class="v2-account" id="home-profile-link" type="button" aria-label="Open Account" aria-haspopup="dialog"><span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.2" r="3.2"/><path d="M5.1 20v-2.1c0-3.4 2.8-5.8 6.9-5.8s6.9 2.4 6.9 5.8V20c0 .6-.4 1-1 1H6.1c-.6 0-1-.4-1-1Z"/></svg></span></button>

      <main class="v2-scroll" id="home-scroll" aria-label="Today">

        <header class="hybrid-hero"><div class="v2-wordmark">FitLens</div><div class="hybrid-hero-wash" aria-hidden="true"></div><div class="hybrid-mascot" aria-hidden="true"><svg id="hybrid-mascot"></svg></div></header>
        <aside class="v2-attention" id="v2-attention" aria-label="Persistent attention" hidden></aside>

        <section class="v2-week" aria-labelledby="v2-week-title">

          <div class="v2-section-heading"><h2 id="v2-week-title">This week</h2><div class="v2-week-controls"><button type="button" id="v2-previous-week" aria-label="Previous week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button type="button" id="v2-next-week" aria-label="Next week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button></div></div>

          <div class="v2-date-viewport" id="v2-date-viewport"><div class="v2-dates" id="v2-dates" role="group" aria-label="Select a day" aria-describedby="hybrid-week-legend"></div></div>
          <p class="hybrid-week-legend" id="hybrid-week-legend"><span class="hybrid-content-dot" aria-hidden="true"></span>Planned or recorded activity</p>

        </section>

        <section class="v2-stage" id="v2-stage" aria-labelledby="v2-stage-title">

          <div class="v2-date-heading"><p id="v2-selected-date"></p><button type="button" class="v2-text-button" id="v2-today" hidden>Today</button></div>

          <div id="v2-stage-content"></div>

        </section>

        <section class="hybrid-activity" aria-labelledby="hybrid-activity-title">
          <h2 id="hybrid-activity-title">Today’s activity</h2>
          <div class="hybrid-bento">
            <button type="button" class="hybrid-steps-card" data-home-link="steps" aria-label="Steps — sample data, 3,150 steps">
              <span class="hybrid-card-label">Steps <small>Sample</small><span aria-hidden="true">›</span></span>
              <span id="hybrid-steps-sun" aria-hidden="true"></span>
            </button>
            <article class="hybrid-metric-card hybrid-time-card"><h3>Workout Time</h3><p><strong id="hybrid-workout-minutes">—</strong> <span>min</span></p><img src="assets/icons/workout-time.svg" alt="" aria-hidden="true"></article>
            <article class="hybrid-metric-card hybrid-sets-card"><h3>Sets completed</h3><p><strong id="hybrid-workout-sets">—</strong> <span>sets</span></p><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" rx="8"/><path d="m13 20 5 5 10-11"/></svg></article>
          </div>
        </section>

        <p class="v2-announcement" id="v2-announcement" role="status" aria-live="polite" aria-atomic="true"></p>

      </main>

      <footer class="v2-bottom"><nav class="v2-dock" aria-label="Main navigation" id="v2-dock"></nav></footer>

      <div class="v2-home-indicator" aria-hidden="true"></div>

    </div>

  </div></body></html>
