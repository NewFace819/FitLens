<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>FitLens — Home UI</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="home-refresh.css?v=reminders-8">
  <link rel="stylesheet" href="steps-sun.css?v=sun-1">
  <link rel="stylesheet" href="mobile-polish.css?v=1">
  <script src="mascot-face.js?v=faces-1" defer></script>
<script src="steps-sun-data.js?v=sun-2" defer></script>
  <script src="steps-sun.js?v=sun-1" defer></script>
  <script src="home.js?v=home-motion-5" defer></script>
<link rel="stylesheet" href="mascot-face.css?v=faces-1"><script src="setup-plan-model.js?v=8" defer></script><script src="home-plan.js?v=reminders-8" defer></script></head>
<body>
<!-- Local design preview. All activity values are sample data. -->
<div id="fitlens-home-preview">
  <div class="fl-phone fl-home-phone" data-motion="full" data-running="true" aria-label="FitLens Home screen with sample activity data">
    <div class="fl-status"><span>9:41</span><div class="fl-island"></div><span class="fl-status-icons"><svg data-icon="signal" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h2v-3H3zM8 20h2v-7H8zM13 20h2V9h-2zM18 20h2V5h-2z" fill="currentColor" stroke="none"/></svg><svg data-icon="wifi" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 15a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg><svg data-icon="battery-full" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="17" height="12" rx="2"/><path d="M22 10v4"/><rect x="5" y="9" width="11" height="6" rx="1" fill="currentColor" stroke="none"/></svg></span></div>
    <!-- The face reflects the latest check-in in this demo tab. -->
    <header class="fl-hero" data-mood="happy">
      <div class="fl-halo"></div><div class="fl-halo-secondary"></div>
      <div class="fl-topline"><span class="fl-brand">FITLENS</span><button class="fl-motion-toggle" id="home-motion" type="button" aria-label="Pause ambient motion" aria-pressed="false" title="Pause ambient motion"><svg class="motion-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="motion-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 10 7-10 7Z" stroke-linejoin="round"/></svg></button></div>
      <button class="fl-face-button" id="home-face" type="button" aria-label="Say hello to FitLens"><svg class="fl-face" viewBox="0 0 180 110" role="img" aria-labelledby="fl-face-title">
        <title id="fl-face-title">A cheerful face with an open smile</title>
        <defs><clipPath id="fl-mouth-clip"><path d="M46 58 C51 40 68 49 84 51 C105 55 124 39 134 54 C145 74 124 95 99 95 C76 96 44 82 46 58Z"/></clipPath></defs>
        <circle class="fl-eye-shape" cx="37" cy="25" r="3.2"/>
        <circle class="fl-eye-shape" cx="143" cy="32" r="3.2"/>
        <path class="fl-mouth-shape" d="M46 58 C51 40 68 49 84 51 C105 55 124 39 134 54 C145 74 124 95 99 95 C76 96 44 82 46 58Z"/>
        <g clip-path="url(#fl-mouth-clip)"><ellipse class="fl-tongue" cx="117" cy="93" rx="29" ry="19" transform="rotate(-19 117 93)"/></g>
      </svg><span class="fl-face-spark fl-spark-one" aria-hidden="true">✦</span><span class="fl-face-spark fl-spark-two" aria-hidden="true">✧</span></button>
    </header>
    <main class="fl-content fl-home-scroll" id="home-scroll">
      <div class="fl-greeting">Good morning, friend</div>
      <h1 id="home-headline">A little movement.<br>A <span>brighter day.</span></h1>
      <a class="fl-last-checkin" id="home-last-checkin" href="post-walk-restored.html" hidden><span class="checkin-dot" aria-hidden="true"></span><span id="home-checkin-label"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a>
      <section class="fl-activity" aria-labelledby="fl-activity-title">
        <div class="fl-section-heading"><h2 id="fl-activity-title">Today’s activity</h2></div>
        <div class="fl-bento">
          <a href="steps.html" class="fl-tile fl-steps" aria-label="View steps details">
            <div class="fl-card-label">Steps<svg data-icon="chevron-right" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></div>
            <p class="fl-typical">Below your usual</p>
            <div class="home-steps-sun" id="home-steps-sun"></div>
          </a>
          <article class="fl-tile fl-time"><div class="fl-card-label">Workout Time</div><div class="fl-mini-data"><strong>25<span>min</span></strong><span class="fl-metric-art"><img src="assets/icons/workout-time.svg" alt="" aria-hidden="true"></span></div></article>
          <article class="fl-tile fl-energy"><div class="fl-card-label">Active Energy</div><div class="fl-mini-data"><strong>180<span>kcal</span></strong><span class="fl-metric-art"><img src="assets/icons/active-energy.svg" alt="" aria-hidden="true"></span></div></article>
        </div>
      </section>
      <section class="fl-workout" aria-labelledby="fl-workout-title">
        <h2 id="fl-workout-title">Your next session</h2>
        <a class="fl-session-card" href="setup-plan.html?v=1">
          <div class="fl-session-art" aria-hidden="true"><span></span><img src="assets/illustrations/full.svg" alt=""></div>
          <h3>Make room<br>for movement.</h3>
          <div class="fl-session-action"><span>Choose a workout</span><span class="fl-session-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></span></div>
        </a>
      </section>
            <section class="fl-food-preview" aria-labelledby="fl-food-preview-title">
        <div class="fl-food-divider" aria-hidden="true"></div>
        <h2 id="fl-food-preview-title" class="fl-food-heading">Food for today</h2>
        <a class="fl-food-editorial-row" href="food.html" aria-label="Explore meals: Three meals to make at home">
          <span class="fl-food-main-line">Three meals to make at home</span>
          <span class="fl-food-editorial-action">
            <span>Explore meals</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </span>
        </a>
      </section>
    </main>
    <div class="fl-home-announcement" id="home-announcement" aria-live="polite"></div>
    <footer class="fl-bottom">
      <nav class="fl-dock" aria-label="Main navigation"><div class="fl-dock-item fl-selected" aria-current="page"><svg data-icon="house" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-8H9v8H4a1 1 0 0 1-1-1Z"/></svg><span>Today</span></div><a class="fl-dock-item" href="workouts.html?v=reminders-8"><svg data-icon="dumbbell" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M4 8l4-4m8 16 4-4M2 6l4-4m12 20 4-4M3 9l6-6m6 18 6-6"/></svg><span>Workouts</span></a><a class="fl-dock-item" href="insights.html"><svg data-icon="chart-no-axes-combined" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V11m6 10V7m6 14v-7m6 7V3M3 7l6-4 6 6 6-8"/></svg><span>Insights</span></a></nav>
      <div class="fl-home-indicator"></div>
    </footer>
  </div>
</div>
</body>
</html>
